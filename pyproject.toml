[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsync-replace"
version = "0.1.1"
description = "Atomic, durable file replacement: temp file, fsync, rename, fsync the directory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["atomic", "fsync", "durable", "crash", "write", "file"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/fsync-replace"
Issues = "https://github.com/sandeshbagmare/fsync-replace/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fsync_replace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
